<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouvel utilisateur</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container form-page">
    <a th:href="@{/utilisateurs}">&larr; Retour aux utilisateurs</a>
    <h1>Nouvel utilisateur</h1>

    <form th:action="@{/utilisateurs}" th:object="${utilisateurRequest}" method="post" novalidate>
        <div class="form-group">
            <label for="nom">Nom</label>
            <input type="text" id="nom" th:field="*{nom}" th:errorclass="field-error">
            <span class="error" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" th:field="*{email}" th:errorclass="field-error" placeholder="nom@exemple.com">
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
        <div class="form-group">
            <label for="telephone">Téléphone</label>
            <input type="text" id="telephone" th:field="*{telephone}" th:errorclass="field-error">
        </div>
        <div class="form-group">
            <label for="typeUtilisateur">Type d'utilisateur</label>
            <select id="typeUtilisateur" th:field="*{typeUtilisateur}" th:errorclass="field-error">
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>
        <div class="actions-bar">
            <button type="submit">Créer l'utilisateur</button>
            <a class="btn btn-secondary" th:href="@{/utilisateurs}">Annuler</a>
        </div>
    </form>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
