<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Places disponibles</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h1>Places disponibles</h1>
    <p class="subtitle" th:text="${places.size()} + ' place(s) libre(s) en ce moment'">0 place(s) libre(s)</p>
    <table>
        <thead>
        <tr><th>Numéro</th><th>Zone</th><th>Type</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${places}">
            <td data-label="Numéro" th:text="${p.numero}">A-01</td>
            <td data-label="Zone" th:text="${p.zone}">A</td>
            <td data-label="Type"><span th:class="'badge badge-' + ${#strings.toLowerCase(p.type)}" th:text="${p.type}">STANDARD</span></td>
        </tr>
        </tbody>
    </table>
    <div class="empty-state" th:if="${places.isEmpty()}"><p>Aucune place disponible actuellement.</p></div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
