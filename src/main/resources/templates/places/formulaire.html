<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouvelle place</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container form-page">
    <a th:href="@{/places}">&larr; Retour aux places</a>
    <h1>Nouvelle place</h1>

    <form th:action="@{/places}" th:object="${placeRequest}" method="post" novalidate>
        <div class="form-group">
            <label for="numero">Numéro</label>
            <input type="text" id="numero" th:field="*{numero}" th:errorclass="field-error" placeholder="Ex. A-01">
            <span class="error" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"></span>
        </div>
        <div class="form-group">
            <label for="zone">Zone</label>
            <input type="text" id="zone" th:field="*{zone}" th:errorclass="field-error" placeholder="Ex. A">
            <span class="error" th:if="${#fields.hasErrors('zone')}" th:errors="*{zone}"></span>
        </div>
        <div class="form-group">
            <label for="type">Type de place</label>
            <select id="type" th:field="*{type}" th:errorclass="field-error">
                <option value="">-- Choisir --</option>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span>
        </div>
        <div class="form-group">
            <label for="statut">Statut initial</label>
            <select id="statut" th:field="*{statut}" th:errorclass="field-error">
                <option th:each="s : ${statuts}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>
        <div class="actions-bar">
            <button type="submit">Créer la place</button>
            <a class="btn btn-secondary" th:href="@{/places}">Annuler</a>
        </div>
    </form>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
