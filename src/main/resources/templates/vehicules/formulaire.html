<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouveau véhicule</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container form-page">
    <a th:href="@{/vehicules}">&larr; Retour aux véhicules</a>
    <h1>Nouveau véhicule</h1>

    <div class="alert-error" th:if="${utilisateurs.isEmpty()}">
        Aucun utilisateur n'existe encore : <a th:href="@{/utilisateurs/nouveau}">crée d'abord un utilisateur</a>.
    </div>

    <form th:action="@{/vehicules}" th:object="${vehiculeRequest}" method="post" novalidate>
        <div class="form-group">
            <label for="immatriculation">Immatriculation</label>
            <input type="text" id="immatriculation" th:field="*{immatriculation}" th:errorclass="field-error" placeholder="Ex. 1234 TAB">
            <span class="error" th:if="${#fields.hasErrors('immatriculation')}" th:errors="*{immatriculation}"></span>
        </div>
        <div class="form-group">
            <label for="marque">Marque</label>
            <input type="text" id="marque" th:field="*{marque}" th:errorclass="field-error">
        </div>
        <div class="form-group">
            <label for="modele">Modèle</label>
            <input type="text" id="modele" th:field="*{modele}" th:errorclass="field-error">
        </div>
        <div class="form-group">
            <label for="typeVehicule">Type de véhicule</label>
            <select id="typeVehicule" th:field="*{typeVehicule}" th:errorclass="field-error">
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="utilisateurId">Propriétaire</label>
            <select id="utilisateurId" th:field="*{utilisateurId}" th:errorclass="field-error">
                <option value="">-- Choisir --</option>
                <option th:each="u : ${utilisateurs}" th:value="${u.id}" th:text="${u.nom} + ' (n°' + ${u.id} + ')'"></option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('utilisateurId')}" th:errors="*{utilisateurId}"></span>
        </div>
        <div class="actions-bar">
            <button type="submit">Enregistrer le véhicule</button>
            <a class="btn btn-secondary" th:href="@{/vehicules}">Annuler</a>
        </div>
    </form>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
