services:
  postgres:
    image: postgres:16
    container_name: parking-postgres
    environment:
      POSTGRES_DB: parking_db
      POSTGRES_USER: parking_user
      POSTGRES_PASSWORD: parking_pass
    ports:
      - "5433:5432"
    volumes:
      - parking_pgdata:/var/lib/postgresql/data

volumes:
  parking_pgdata:
